name: Terraform Validate (PR)

# Runs on every pull request touching Terraform or the Glue scripts.
# No AWS credentials needed for fmt/validate/lint - those checks are all
# static, against the config as written, not against real AWS state.
# `terraform plan` DOES need read access to AWS (to diff against real
# infra), so that job assumes the OIDC deploy role read-only-in-effect
# (plan never mutates anything) and posts the plan back as a PR comment
# for human review before merge.

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "utils/**.py"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write # to post the plan as a PR comment
  id-token: write # to mint the OIDC token for the plan job

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "eu-west-2"
  TF_DIR: "terraform"

jobs:
  fmt-and-validate:
    name: fmt / validate / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt (check only, no AWS credentials needed)
        run: terraform fmt -check -recursive -diff

      - name: terraform init (backend disabled - syntax/config check only)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest
      - run: tflint --init && tflint -f compact

      - name: Checkov (IaC security scan)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true # report findings without blocking the PR (tune to false once the baseline is clean)

      - name: Python syntax check (Glue scripts)
        run: |
          python3 -m py_compile utils/transform_orders.py utils/data_quality_check.py

  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan.binary | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8').slice(-60000);
            const body = `### Terraform Plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
